name: Go Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Download modules
      run: go mod download

    - name: Lint
      uses: golangci-lint/golangci-lint-action@v6
      with:
        version: v1.64

    - name: Build
      run: go build ./...

    - name: Run tests with coverage
      run: go test -race -coverprofile=coverage.out ./...

    - name: Coverage gate (>= 85%)
      run: |
        total=$(go tool cover -func=coverage.out | awk 'END {print $3}')
        value=${total%.*}
        echo "total coverage: $total"
        if [ "$value" -lt 85 ]; then
          echo "coverage is below the 85% gate"
          exit 1
        fi
